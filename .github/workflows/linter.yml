name: Lint Code Base
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
permissions: read-all
jobs:
  get-sloc:
    name: Count Lines of Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.20.0"
      - name: Install dependencies
        run: go install github.com/boyter/scc/v3@latest
      - name: Run scc tool
        run: scc --format wide
  check-broken-links:
    name: Check documentation external links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check broken links
        # yamllint disable-line rule:line-length
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
  check-super-linter:
    name: Check syntax (super-linter)
    permissions:
      contents: read
      models: read
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/linter.yml@eaf817d527a52410bd6e85ad08a5acbd2039ae3a # v13.3.1
    with:
      validate_overrides: >-
        {
          "PYTHON_BLACK_CONFIG_FILE": "pyproject.toml",
          "PYTHON_ISORT_CONFIG_FILE": "pyproject.toml",
          "PYTHON_MYPY_CONFIG_FILE": "pyproject.toml",
          "VALIDATE_PYTHON_MYPY": "false",
          "PYTHON_PYLINT_CONFIG_FILE": "pyproject.toml",
          "VALIDATE_PYTHON_PYLINT": "false",
          "PYTHON_RUFF_CONFIG_FILE": "pyproject.toml",
          "PYTHON_RUFF_FORMAT_CONFIG_FILE": "pyproject.toml",
          "SPELL_CODESPELL_CONFIG_FILE": ".codespellrc"
        }
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
  check-python-lint:
    name: Check Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run Python lint
        run: uv run --frozen tox -e lint
