name: Lint Code Base
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting and YAML
        run: uv run --frozen tox -e lint
  check-super-linter:
    name: Check syntax (super-linter)
    permissions:
      contents: read
      models: read
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/linter.yml@0df06b4e1880bf64e290783ddbfe850f849a27af # v9.4.1
    with:
      validate_overrides: |-
        {
          "VALIDATE_BIOME_FORMAT": false,
          "PYTHON_ISORT_CONFIG_FILE": "pyproject.toml",
          "PYTHON_RUFF_FORMAT_CONFIG_FILE": "pyproject.toml"
        }
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
