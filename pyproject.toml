[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "gh-updater"
version = "0.1.0"
description = "Update GitHub Actions references to the latest stable commit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "PyYAML>=6.0.2,<7"]

[project.scripts]
gh-updater = "gh_updater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_updater"]

[dependency-groups]
dev = ["tox>=4.22,<5", "pre-commit>=4,<5"]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
fmt = ["ruff>=0.11,<1", "yamllint>=1.35,<2"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.tox]
env_list = ["test", "coverage", "lint"]

[tool.tox.env.test]
description = "Run unit and CLI integration tests"
dependency_groups = ["test"]
commands = [
    ["pytest", "{posargs:tests}"],
    ["gh-updater", "--help"],
]

[tool.tox.env.coverage]
description = "Require at least 80 percent test coverage"
dependency_groups = ["test"]
commands = [
    ["pytest", "--cov=gh_updater", "--cov-report=term-missing", "--cov-fail-under=80", "{posargs:tests}"],
]

[tool.tox.env.lint]
description = "Check Python formatting, imports, and repository YAML"
dependency_groups = ["fmt"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
    ["yamllint", ".github", ".pre-commit-config.yaml", ".yamllint.yml"],
]

[tool.tox.env.fmt]
description = "Format Python and sort imports"
dependency_groups = ["fmt"]
commands = [
    ["ruff", "check", "--select", "I", "--fix", "."],
    ["ruff", "format", "."],
]
